<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Platforma Scoala</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --line: #2a2f3a;
    --text: #eef1f6;
    --muted: #949bab;
    --accent: #3b82f6;
    --accent-ink: #ffffff;
    --danger: #ef4444;
    --warn: #f59e0b;
    --on: #22c55e;
    --off: #596070;
    --me: #234e8a;
    --other: #222733;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  input {
    font-family: inherit; background: var(--panel2);
    border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 15px;
    width: 100%; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #login { height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 30px 26px;
  }
  .brand { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .brand-sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .field-label { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .btn {
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600;
    width: 100%; margin-top: 20px;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .msg-error { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 16px; text-align: center; }

  /* ---------- App ---------- */
  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  header .title { font-weight: 700; font-size: 16px; }
  header .channel { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header .who { font-size: 13px; color: var(--muted); text-align: right; }
  header .who b { color: var(--text); }
  .badge { font-size: 11px; background: var(--accent); color: #fff; padding: 2px 7px; border-radius: 999px; margin-left: 6px; }
  .link-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 7px 12px; font-size: 13px;
  }
  .link-btn:hover { color: var(--text); border-color: var(--muted); }

  /* avatar */
  .avatar {
    border-radius: 50%; background: var(--panel2); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; overflow: hidden; flex: 0 0 auto; user-select: none;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #me-avatar { width: 38px; height: 38px; cursor: pointer; border: 2px solid transparent; }
  #me-avatar:hover { border-color: var(--accent); }

  #body { flex: 1; display: flex; min-height: 0; }

  /* ----- sidebar ----- */
  #sidebar {
    width: 250px; flex: 0 0 auto; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .side-section { padding: 14px 0 10px; }
  .side-section + .side-section { border-top: 1px solid var(--line); }
  .side-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 0 16px 8px; display: flex; align-items: center;
  }
  .side-title .add {
    margin-left: auto; width: 22px; height: 22px; border-radius: 6px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .side-title .add:hover { border-color: var(--accent); }

  .user-item { display: flex; align-items: center; gap: 10px; padding: 7px 16px; }
  .avatar-wrap { position: relative; flex: 0 0 auto; }
  .avatar-wrap .avatar { width: 34px; height: 34px; font-size: 14px; }
  .avatar-wrap .dot {
    position: absolute; right: -1px; bottom: -1px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--off); border: 2px solid var(--panel);
  }
  .avatar-wrap .dot.on { background: var(--on); }
  .user-item .u-info { min-width: 0; }
  .user-item .u-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-item .u-status { font-size: 11px; color: var(--muted); }
  .user-item.me .u-name { color: var(--accent); }

  /* tasks */
  #task-list { padding: 0 10px; }
  .task {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 10px; margin: 0 6px 8px; display: flex; gap: 9px; align-items: flex-start;
    position: relative;
  }
  .task .chk {
    width: 18px; height: 18px; flex: 0 0 auto; margin-top: 1px;
    border-radius: 5px; border: 2px solid var(--muted); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px;
  }
  .task.done .chk { background: var(--on); border-color: var(--on); }
  .task .t-body { min-width: 0; flex: 1; }
  .task .t-title { font-size: 14px; line-height: 1.3; word-break: break-word; }
  .task.done .t-title { text-decoration: line-through; color: var(--muted); }
  .task .t-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .task .t-due.overdue { color: var(--danger); font-weight: 600; }
  .task .t-del {
    background: transparent; border: none; color: var(--muted); font-size: 13px;
    position: absolute; top: 6px; right: 7px; opacity: 0;
  }
  .task:hover .t-del { opacity: 1; }
  .task .t-del:hover { color: var(--danger); }
  .empty-mini { color: var(--muted); font-size: 13px; padding: 2px 16px 6px; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.mine { justify-content: flex-end; }
  .row .avatar { width: 30px; height: 30px; font-size: 13px; }
  .bubble { max-width: 70%; background: var(--other); border-radius: 14px; padding: 9px 13px; position: relative; }
  .row.mine .bubble { background: var(--me); }
  .bubble .meta { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .bubble .meta b { color: var(--text); }
  .bubble .text { font-size: 15px; white-space: pre-wrap; word-break: break-word; line-height: 1.35; }
  .bubble .time { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
  .file {
    display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-top: 4px;
  }
  .file .ico { font-size: 20px; }
  .file .info { flex: 1; min-width: 0; }
  .file .name { font-size: 14px; word-break: break-all; }
  .file .size { font-size: 12px; color: var(--muted); }
  .file .dl { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 11px; font-size: 13px; font-weight: 600; }
  .del {
    position: absolute; top: 6px; right: 8px; background: transparent; border: none;
    color: var(--muted); font-size: 13px; opacity: 0; transition: opacity .15s;
  }
  .bubble:hover .del { opacity: 1; }
  .del:hover { color: var(--danger); }
  .day-sep { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; flex: 0 0 auto; }
  .attach-preview {
    display: none; align-items: center; gap: 10px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px;
  }
  .attach-preview .x { margin-left: auto; background: transparent; border: none; color: var(--muted); font-size: 16px; }
  .composer { display: flex; align-items: flex-end; gap: 10px; }
  .icon-btn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; width: 46px; height: 46px; font-size: 20px; flex: 0 0 auto;
  }
  .icon-btn:hover { border-color: var(--accent); }
  #composer-text { resize: none; min-height: 46px; max-height: 140px; padding: 12px 14px; line-height: 1.35; }
  .send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    height: 46px; padding: 0 20px; font-size: 15px; font-weight: 600; flex: 0 0 auto;
  }
  .send:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .center-note { color: var(--muted); text-align: center; margin-top: 40px; font-size: 14px; }

  /* modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .modal-card h3 { margin: 0 0 14px; font-size: 17px; }
  .modal-card label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal-actions .ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 9px; padding: 10px 16px; }
  .modal-actions .primary { background: var(--accent); border: none; color: #fff; border-radius: 9px; padding: 10px 18px; font-weight: 600; }
</style>
</head>
<body>

  <!-- ====================== LOGIN ====================== -->
  <div id="login">
    <div class="card">
      <h1 class="brand">Platforma Scoala</h1>
      <p class="brand-sub">Intră cu contul tău</p>
      <div id="login-form">
        <div class="field-label">E-mail</div>
        <input id="email" type="email" autocomplete="username" placeholder="nume@scoala.ro" />
        <div class="field-label">Parolă</div>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <button id="login-btn" class="btn">Intră</button>
        <div id="login-error" class="msg-error"></div>
      </div>
      <div id="name-form" class="hidden">
        <div class="field-label">Cum te numești? (apare la mesajele tale)</div>
        <input id="display-name" type="text" placeholder="Ex: Maria Popescu" />
        <button id="name-btn" class="btn">Continuă</button>
        <div id="name-error" class="msg-error"></div>
      </div>
    </div>
  </div>

  <!-- ====================== APP ====================== -->
  <div id="app" class="hidden">
    <header>
      <div class="avatar" id="me-avatar" title="Schimbă poza ta"></div>
      <div>
        <div class="title">Platforma Scoala</div>
        <div class="channel"># general — toți colegii</div>
      </div>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
      <button id="logout-btn" class="link-btn">Ieșire</button>
    </header>

    <div id="body">
      <aside id="sidebar">
        <div class="side-section">
          <div class="side-title" id="colleagues-title">Colegi</div>
          <div id="user-list"></div>
        </div>
        <div class="side-section">
          <div class="side-title">De făcut <button class="add" id="add-task" title="Adaugă task">+</button></div>
          <div id="task-list"></div>
        </div>
      </aside>

      <div id="main">
        <div id="messages">
          <div class="center-note" id="loading-note">Se încarcă mesajele…</div>
        </div>
        <footer>
          <div class="attach-preview" id="attach-preview">
            <span>📎</span>
            <span id="attach-name"></span>
            <button class="x" id="attach-remove" title="Scoate fișierul">✕</button>
          </div>
          <div class="composer">
            <input type="file" id="file-input" class="hidden" />
            <button class="icon-btn" id="attach-btn" title="Atașează un fișier">📎</button>
            <textarea id="composer-text" placeholder="Scrie un mesaj…"></textarea>
            <button class="send" id="send-btn">Trimite</button>
          </div>
          <div class="hint">Enter = trimite · Shift+Enter = rând nou · fișiere până la 700 KB</div>
        </footer>
      </div>
    </div>
  </div>

  <!-- input ascuns pentru poza de profil -->
  <input type="file" id="avatar-input" accept="image/*" class="hidden" />

  <!-- modal task -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Task nou</h3>
      <label>Ce e de făcut</label>
      <input id="t-title" type="text" placeholder="Ex: Pregătit raportul lunar" />
      <label>Cine participă</label>
      <input id="t-part" type="text" placeholder="Ex: Maria, Ion (opțional)" />
      <label>Termen</label>
      <input id="t-due" type="date" />
      <div class="modal-actions">
        <button class="ghost" id="t-cancel">Anulează</button>
        <button class="primary" id="t-save">Adaugă</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script>
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyA8mFN_Lr5ouYaasGBBx7apPBNGZJFnZNM",
    authDomain: "proiect-interfata-scolara.firebaseapp.com",
    projectId: "proiect-interfata-scolara",
    storageBucket: "proiect-interfata-scolara.firebasestorage.app",
    messagingSenderId: "472604429439",
    appId: "1:472604429439:web:d135532decc771317f434a"
  };
  const ADMIN_EMAILS = [ "grama.razvan95@gmail.com" ];
  const MAX_FILE_BYTES = 700 * 1024;
  const HEARTBEAT_MS = 25000;
  const ONLINE_WINDOW_MS = 60000;
  const AVATAR_PX = 128; // poza de profil se micșorează la 128x128
  // ============================================================
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  const el = (id) => document.getElementById(id);
  const loginView = el('login'), appView = el('app');
  const loginForm = el('login-form'), nameForm = el('name-form');

  let currentUser = null, currentName = null;
  let unsubMessages = null, unsubPresence = null, unsubUsers = null, unsubTasks = null;
  let heartbeatTimer = null, presenceRenderTimer = null;
  let presenceDocs = [], tasksDocs = [], usersMap = {};
  let pendingFile = null;

  function isAdmin(email) {
    return ADMIN_EMAILS.map(e => e.toLowerCase()).includes((email || '').toLowerCase());
  }

  // ---------------- LOGIN ----------------
  el('login-btn').addEventListener('click', doLogin);
  el('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  async function doLogin() {
    const email = el('email').value.trim(), pass = el('password').value;
    const errBox = el('login-error'); errBox.textContent = '';
    if (!email || !pass) { errBox.textContent = 'Completează e-mailul și parola.'; return; }
    el('login-btn').disabled = true;
    try { await auth.signInWithEmailAndPassword(email, pass); }
    catch (e) { errBox.textContent = translateAuthError(e.code); }
    finally { el('login-btn').disabled = false; }
  }
  function translateAuthError(code) {
    switch (code) {
      case 'auth/invalid-email': return 'Adresa de e-mail nu este validă.';
      case 'auth/user-disabled': return 'Acest cont a fost dezactivat.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return 'E-mail sau parolă greșite.';
      case 'auth/too-many-requests': return 'Prea multe încercări. Așteaptă puțin.';
      case 'auth/network-request-failed': return 'Fără conexiune la internet.';
      default: return 'Nu am putut autentifica. Încearcă din nou.';
    }
  }

  el('name-btn').addEventListener('click', saveName);
  el('display-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveName(); });
  async function saveName() {
    const name = el('display-name').value.trim();
    const errBox = el('name-error'); errBox.textContent = '';
    if (name.length < 2) { errBox.textContent = 'Scrie un nume (minim 2 litere).'; return; }
    el('name-btn').disabled = true;
    try {
      await db.collection('users').doc(currentUser.uid).set({
        displayName: name, email: currentUser.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      currentName = name; enterApp();
    } catch (e) { errBox.textContent = 'Nu am putut salva numele.'; }
    finally { el('name-btn').disabled = false; }
  }

  // ---------------- AUTH STATE ----------------
  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if (!user) {
      stopLive();
      appView.classList.add('hidden'); loginView.classList.remove('hidden');
      loginForm.classList.remove('hidden'); nameForm.classList.add('hidden');
      el('password').value = ''; return;
    }
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists && doc.data().displayName) { currentName = doc.data().displayName; enterApp(); }
      else {
        loginView.classList.remove('hidden'); appView.classList.add('hidden');
        loginForm.classList.add('hidden'); nameForm.classList.remove('hidden');
        el('display-name').focus();
      }
    } catch (e) { currentName = user.email; enterApp(); }
  });

  el('logout-btn').addEventListener('click', async () => { await setPresence(false); auth.signOut(); });

  function enterApp() {
    loginView.classList.add('hidden'); appView.classList.remove('hidden');
    const admin = isAdmin(currentUser.email);
    el('who').innerHTML = 'Conectat ca <b>' + escapeHtml(currentName) + '</b>' + (admin ? '<span class="badge">admin</span>' : '');
    listenUsers(); listenMessages(); startPresence(); listenTasks();
    renderMeAvatar();
  }

  function stopLive() {
    [unsubMessages, unsubPresence, unsubUsers, unsubTasks].forEach(u => { if (u) u(); });
    unsubMessages = unsubPresence = unsubUsers = unsubTasks = null;
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    if (presenceRenderTimer) { clearInterval(presenceRenderTimer); presenceRenderTimer = null; }
  }

  // ---------------- USERS (nume + poze) ----------------
  function listenUsers() {
    if (unsubUsers) unsubUsers();
    unsubUsers = db.collection('users').onSnapshot((snap) => {
      usersMap = {};
      snap.docs.forEach(d => { usersMap[d.id] = d.data(); });
      renderMeAvatar(); renderPresence(); // reîmprospătează pozele
    }, () => {});
  }

  function avatarEl(uid, name, cls) {
    const wrap = document.createElement('div');
    wrap.className = 'avatar';
    const u = usersMap[uid];
    if (u && u.photo) {
      const img = document.createElement('img'); img.src = u.photo; wrap.appendChild(img);
    } else {
      wrap.textContent = (name || '?').trim().charAt(0).toUpperCase();
      wrap.style.background = colorFor(uid || name || '?');
    }
    return wrap;
  }
  function colorFor(s) {
    let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return 'hsl(' + h + ',45%,42%)';
  }

  function renderMeAvatar() {
    const box = el('me-avatar'); if (!box || !currentUser) return;
    box.innerHTML = '';
    const u = usersMap[currentUser.uid];
    if (u && u.photo) { const img = document.createElement('img'); img.src = u.photo; box.appendChild(img); }
    else { box.textContent = (currentName || '?').charAt(0).toUpperCase(); box.style.background = colorFor(currentUser.uid); }
  }

  // schimbare poză profil
  el('me-avatar').addEventListener('click', () => el('avatar-input').click());
  el('avatar-input').addEventListener('change', (e) => {
    const f = e.target.files[0]; el('avatar-input').value = '';
    if (!f) return;
    resizeImage(f, AVATAR_PX, (dataUrl) => {
      db.collection('users').doc(currentUser.uid).set({ photo: dataUrl }, { merge: true })
        .catch(() => alert('Nu am putut salva poza.'));
    });
  });

  function resizeImage(file, size, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        // crop pătrat centrat
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        cb(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => alert('Imagine invalidă.');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------------- MESAJE ----------------
  function listenMessages() {
    if (unsubMessages) unsubMessages();
    unsubMessages = db.collection('messages').orderBy('createdAt', 'asc').limitToLast(300)
      .onSnapshot((snap) => renderMessages(snap.docs), (err) => {
        el('messages').innerHTML = '<div class="center-note">Nu pot citi mesajele.<br><small>' + escapeHtml(err.message) + '</small></div>';
      });
  }
  function renderMessages(docs) {
    const box = el('messages');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.innerHTML = '';
    if (docs.length === 0) { box.innerHTML = '<div class="center-note">Încă niciun mesaj. Scrie primul! 👋</div>'; return; }
    const admin = isAdmin(currentUser.email);
    let lastDay = '';
    docs.forEach((d) => {
      const m = d.data();
      const ts = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : new Date();
      const dayLabel = ts.toLocaleDateString('ro-RO', { day: 'numeric', month: 'long', year: 'numeric' });
      if (dayLabel !== lastDay) {
        lastDay = dayLabel;
        const sep = document.createElement('div'); sep.className = 'day-sep'; sep.textContent = dayLabel; box.appendChild(sep);
      }
      const mine = m.uid === currentUser.uid;
      const row = document.createElement('div'); row.className = 'row' + (mine ? ' mine' : '');
      if (!mine) row.appendChild(avatarEl(m.uid, m.displayName));
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.innerHTML = '<b>' + escapeHtml(m.displayName || 'Cineva') + '</b>';
      bubble.appendChild(meta);
      if (m.type === 'file' && m.fileData) {
        bubble.appendChild(buildFileEl(m));
        if (m.text) { const t = document.createElement('div'); t.className = 'text'; t.textContent = m.text; t.style.marginTop = '6px'; bubble.appendChild(t); }
      } else {
        const t = document.createElement('div'); t.className = 'text'; t.textContent = m.text || ''; bubble.appendChild(t);
      }
      const time = document.createElement('div'); time.className = 'time';
      time.textContent = ts.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
      bubble.appendChild(time);
      if (mine || admin) {
        const del = document.createElement('button'); del.className = 'del'; del.textContent = '🗑'; del.title = 'Șterge mesajul';
        del.addEventListener('click', () => deleteMessage(d.id)); bubble.appendChild(del);
      }
      row.appendChild(bubble);
      box.appendChild(row);
    });
    if (nearBottom) box.scrollTop = box.scrollHeight;
  }
  function buildFileEl(m) {
    const wrap = document.createElement('div'); wrap.className = 'file';
    wrap.innerHTML = '<div class="ico">📄</div><div class="info"><div class="name">' + escapeHtml(m.fileName) +
      '</div><div class="size">' + formatSize(m.fileSize || 0) + '</div></div>';
    const btn = document.createElement('button'); btn.className = 'dl'; btn.textContent = 'Descarcă';
    btn.addEventListener('click', () => downloadFile(m)); wrap.appendChild(btn); return wrap;
  }
  function downloadFile(m) {
    const a = document.createElement('a'); a.href = m.fileData; a.download = m.fileName || 'fisier';
    document.body.appendChild(a); a.click(); a.remove();
  }
  async function deleteMessage(id) {
    try { await db.collection('messages').doc(id).delete(); } catch (e) { alert('Nu am putut șterge mesajul.'); }
  }

  // ---------------- PREZENȚĂ ----------------
  function startPresence() {
    setPresence(true);
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(() => setPresence(true), HEARTBEAT_MS);
    if (unsubPresence) unsubPresence();
    unsubPresence = db.collection('presence').onSnapshot((snap) => {
      presenceDocs = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderPresence();
    }, () => {});
    if (presenceRenderTimer) clearInterval(presenceRenderTimer);
    presenceRenderTimer = setInterval(renderPresence, 15000);
  }
  async function setPresence(online) {
    if (!currentUser) return;
    try {
      await db.collection('presence').doc(currentUser.uid).set({
        displayName: currentName || currentUser.email, online: !!online,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch (e) {}
  }
  function renderPresence() {
    const list = el('user-list'); if (!list) return;
    const now = Date.now();
    const items = presenceDocs.map(p => {
      const seen = p.lastSeen && p.lastSeen.toDate ? p.lastSeen.toDate().getTime() : 0;
      const online = !!p.online && (now - seen < ONLINE_WINDOW_MS);
      const nm = (usersMap[p.id] && usersMap[p.id].displayName) || p.displayName || 'Cineva';
      return { uid: p.id, name: nm, online, seen, me: p.id === (currentUser && currentUser.uid) };
    });
    items.sort((a, b) => (b.online - a.online) || a.name.localeCompare(b.name, 'ro'));
    const onlineCount = items.filter(i => i.online).length;
    const title = el('colleagues-title'); if (title) title.textContent = 'Colegi — ' + onlineCount + ' activi';
    list.innerHTML = '';
    if (items.length === 0) { list.innerHTML = '<div class="empty-mini">Nimeni încă.</div>'; return; }
    items.forEach(i => {
      const row = document.createElement('div'); row.className = 'user-item' + (i.me ? ' me' : '');
      const aw = document.createElement('div'); aw.className = 'avatar-wrap';
      aw.appendChild(avatarEl(i.uid, i.name));
      const dot = document.createElement('div'); dot.className = 'dot' + (i.online ? ' on' : ''); aw.appendChild(dot);
      const info = document.createElement('div'); info.className = 'u-info';
      const nm = document.createElement('div'); nm.className = 'u-name'; nm.textContent = i.name + (i.me ? ' (tu)' : '');
      const st = document.createElement('div'); st.className = 'u-status';
      st.textContent = i.online ? 'activ acum' : (i.seen ? 'văzut ' + timeAgo(now - i.seen) : 'offline');
      info.appendChild(nm); info.appendChild(st);
      row.appendChild(aw); row.appendChild(info); list.appendChild(row);
    });
  }
  function timeAgo(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return 'acum câteva secunde';
    const m = Math.floor(s / 60); if (m < 60) return 'acum ' + m + ' min';
    const h = Math.floor(m / 60); if (h < 24) return 'acum ' + h + (h === 1 ? ' oră' : ' ore');
    const d = Math.floor(h / 24); return 'acum ' + d + (d === 1 ? ' zi' : ' zile');
  }
  window.addEventListener('beforeunload', () => { setPresence(false); });
  document.addEventListener('visibilitychange', () => { setPresence(document.visibilityState === 'visible'); });

  // ---------------- TASK-URI ----------------
  el('add-task').addEventListener('click', () => {
    el('t-title').value = ''; el('t-part').value = ''; el('t-due').value = '';
    el('task-modal').classList.remove('hidden'); el('t-title').focus();
  });
  el('t-cancel').addEventListener('click', () => el('task-modal').classList.add('hidden'));
  el('task-modal').addEventListener('click', (e) => { if (e.target === el('task-modal')) el('task-modal').classList.add('hidden'); });
  el('t-save').addEventListener('click', saveTask);
  el('t-title').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveTask(); });

  async function saveTask() {
    const title = el('t-title').value.trim();
    if (!title) { el('t-title').focus(); return; }
    const part = el('t-part').value.trim();
    const due = el('t-due').value; // 'YYYY-MM-DD' sau ''
    el('t-save').disabled = true;
    try {
      await db.collection('tasks').add({
        title, participants: part || '', dueDate: due || '',
        done: false, createdBy: currentUser.uid, createdByName: currentName,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      el('task-modal').classList.add('hidden');
    } catch (e) { alert('Nu am putut salva task-ul.'); }
    finally { el('t-save').disabled = false; }
  }

  function listenTasks() {
    if (unsubTasks) unsubTasks();
    unsubTasks = db.collection('tasks').orderBy('createdAt', 'asc').onSnapshot((snap) => {
      tasksDocs = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderTasks();
    }, () => {});
  }
  function renderTasks() {
    const list = el('task-list'); if (!list) return;
    const admin = isAdmin(currentUser.email);
    // nefinalizate întâi; în interior după termen
    const items = tasksDocs.slice().sort((a, b) => {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      const ad = a.dueDate || '9999', bd = b.dueDate || '9999';
      return ad.localeCompare(bd);
    });
    list.innerHTML = '';
    if (items.length === 0) { list.innerHTML = '<div class="empty-mini">Niciun task. Apasă + ca să adaugi.</div>'; return; }
    const today = new Date().toISOString().slice(0, 10);
    items.forEach(t => {
      const row = document.createElement('div'); row.className = 'task' + (t.done ? ' done' : '');
      const chk = document.createElement('button'); chk.className = 'chk'; chk.textContent = t.done ? '✓' : '';
      chk.title = t.done ? 'Marchează nefinalizat' : 'Marchează gata';
      chk.addEventListener('click', () => toggleTask(t));
      const body = document.createElement('div'); body.className = 't-body';
      const ti = document.createElement('div'); ti.className = 't-title'; ti.textContent = t.title;
      body.appendChild(ti);
      const metaBits = [];
      if (t.participants) metaBits.push('👥 ' + t.participants);
      const meta = document.createElement('div'); meta.className = 't-meta';
      meta.textContent = metaBits.join('  ');
      if (t.dueDate) {
        const due = document.createElement('span');
        const overdue = !t.done && t.dueDate < today;
        due.className = 't-due' + (overdue ? ' overdue' : '');
        due.textContent = (metaBits.length ? '  ' : '') + '🗓 până la ' + formatDate(t.dueDate) + (overdue ? ' (depășit)' : '');
        meta.appendChild(due);
      }
      if (t.participants || t.dueDate) body.appendChild(meta);
      row.appendChild(chk); row.appendChild(body);
      if (t.createdBy === currentUser.uid || admin) {
        const del = document.createElement('button'); del.className = 't-del'; del.textContent = '🗑'; del.title = 'Șterge task-ul';
        del.addEventListener('click', () => deleteTask(t.id)); row.appendChild(del);
      }
      list.appendChild(row);
    });
  }
  async function toggleTask(t) {
    try { await db.collection('tasks').doc(t.id).update({ done: !t.done }); } catch (e) { alert('Nu am putut actualiza task-ul.'); }
  }
  async function deleteTask(id) {
    try { await db.collection('tasks').doc(id).delete(); } catch (e) { alert('Nu am putut șterge task-ul.'); }
  }
  function formatDate(ymd) {
    const p = ymd.split('-'); if (p.length !== 3) return ymd;
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  // ---------------- TRIMITERE MESAJ ----------------
  const textArea = el('composer-text');
  textArea.addEventListener('input', autoGrow);
  textArea.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  function autoGrow() { textArea.style.height = 'auto'; textArea.style.height = Math.min(textArea.scrollHeight, 140) + 'px'; }
  el('send-btn').addEventListener('click', sendMessage);
  async function sendMessage() {
    const text = textArea.value.trim();
    if (!text && !pendingFile) return;
    const base = { uid: currentUser.uid, displayName: currentName, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    let payload = pendingFile
      ? Object.assign(base, { type: 'file', text: text || '', fileName: pendingFile.name, fileType: pendingFile.type, fileSize: pendingFile.size, fileData: pendingFile.dataUrl })
      : Object.assign(base, { type: 'text', text });
    el('send-btn').disabled = true;
    try { await db.collection('messages').add(payload); textArea.value = ''; autoGrow(); clearAttachment(); }
    catch (e) { alert('Nu am putut trimite mesajul.'); }
    finally { el('send-btn').disabled = false; textArea.focus(); }
  }

  // ---------------- ATAȘARE FIȘIER ----------------
  el('attach-btn').addEventListener('click', () => el('file-input').click());
  el('attach-remove').addEventListener('click', clearAttachment);
  el('file-input').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > MAX_FILE_BYTES) {
      alert('Fișierul e prea mare (' + formatSize(f.size) + ').\nDeocamdată se pot trimite fișiere până la 700 KB.');
      el('file-input').value = ''; return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      pendingFile = { name: f.name, type: f.type || 'application/octet-stream', size: f.size, dataUrl: reader.result };
      el('attach-name').textContent = f.name + '  (' + formatSize(f.size) + ')';
      el('attach-preview').style.display = 'flex';
    };
    reader.readAsDataURL(f); el('file-input').value = '';
  });
  function clearAttachment() { pendingFile = null; el('attach-preview').style.display = 'none'; el('attach-name').textContent = ''; }

  // ---------------- UTILITARE ----------------
  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }
  </script>
</body>
</html>
